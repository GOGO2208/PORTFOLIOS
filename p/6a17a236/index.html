<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Portafoglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../css/stile.css">
</head>
<body>
<main class="pagina" id="app">
  <form class="accesso" id="accesso" autocomplete="off">
    <h2>Portafoglio</h2>
    <p class="nota">Inserisci la password che hai ricevuto.</p>
    <label for="pw" class="sub">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
    <div class="errore" id="errore" role="alert"></div>
    <button type="submit" id="entra">Apri</button>
  </form>
</main>
<script src="../../js/calc.js"></script>
<script src="../../js/decifra.js"></script>
<script src="../../js/app.js"></script>
<script>
(function(){
  const form=document.getElementById('accesso'), err=document.getElementById('errore'), btn=document.getElementById('entra');
  const csv=t=>t.trim().split(/\r?\n/).slice(1).map(r=>{const [mese,codice,prezzo,data_fonte]=r.split(';');return {mese,codice,prezzo:+prezzo,data_fonte}});
  async function apri(pw){
    btn.disabled=true; btn.textContent='Apertura…'; err.textContent='';
    try{
      const [enc,pz,st]=await Promise.all([fetch('dati.enc',{cache:'no-store'}).then(r=>r.arrayBuffer()),
        fetch('../../prezzi/fine-mese.csv',{cache:'no-store'}).then(r=>r.ok?r.text():'').catch(()=>''), fetch('../../strumenti.json').then(r=>r.json())]);
      const dati=await decifra(enc,pw);
      try{sessionStorage.setItem('pw',pw)}catch(e){}
      document.title='Portafoglio di '+(dati.persona&&dati.persona.etichetta||'');
      const righe=pz?csv(pz):[];
      avvia(document.getElementById('app'),dati,righe,st,{});
      if(!righe.length){const a=document.createElement('p');a.className='nota avviso';a.textContent='Prezzi aggiornati non disponibili: valori calcolati sugli ultimi prezzi noti.';document.getElementById('app').prepend(a)}
    }catch(e){
      err.textContent=e.message==='password'?'Password non corretta. Controlla e riprova.':'Non riesco ad aprire il portafoglio. Riprova tra poco.';
      try{sessionStorage.removeItem('pw')}catch(x){}
      btn.disabled=false; btn.textContent='Apri';
    }
  }
  form.addEventListener('submit',e=>{e.preventDefault();apri(document.getElementById('pw').value)});
  let salvata=null; try{salvata=sessionStorage.getItem('pw')}catch(e){}
  if(salvata) apri(salvata);
})();
</script>
</body>
</html>
