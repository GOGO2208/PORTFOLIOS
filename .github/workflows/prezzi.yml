name: prezzi
on:
  schedule:  # tre tentativi al giorno: GitHub a volte ritarda o salta le esecuzioni programmate; i prezzi già letti non vengono duplicati
    - cron: "23 17 * * *"  # 18:23 ora solare (19:23 legale), dopo la chiusura delle Borse europee
    - cron: "41 21 * * *"  # 22:41 (23:41), recupero se la prima è saltata
    - cron: "37 5 * * *"   # 06:37 (07:37) del giorno dopo, ultimo recupero prima dell'apertura
  workflow_dispatch:
concurrency: prezzi
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica prezzi
        run: MANCANTI="$RUNNER_TEMP/mancanti.txt" bash prezzi/scarica.sh
      - name: Aggiorna fine mese
        run: perl prezzi/fine-mese.pl prezzi/giornalieri.csv prezzi/fine-mese.csv
      - name: Salva
        run: |
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add prezzi/giornalieri.csv prezzi/fine-mese.csv
          git diff --cached --quiet || git commit -m "Prezzi $(TZ=Europe/Rome date +%F)"
          git pull --rebase -q origin main && git push
      - name: Controlla prezzi mancanti o fermi
        run: OGGI="$(TZ=Europe/Rome date +%F)" perl prezzi/controlla.pl prezzi/elenco.tsv prezzi/giornalieri.csv "$RUNNER_TEMP/mancanti.txt"
