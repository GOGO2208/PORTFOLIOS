name: prezzi
on:
  schedule:
    - cron: "0 17 * * *"   # 18:00 ora solare, 19:00 ora legale
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica prezzi
        run: bash prezzi/scarica.sh
      - name: Aggiorna fine mese
        run: perl prezzi/fine-mese.pl prezzi/giornalieri.csv prezzi/fine-mese.csv
      - name: Salva
        run: |
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add prezzi/giornalieri.csv prezzi/fine-mese.csv
          git diff --cached --quiet || git commit -m "Prezzi $(TZ=Europe/Rome date +%F)"
          git push
